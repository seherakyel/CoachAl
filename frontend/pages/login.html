<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachAI - Giriş</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<script id="tailwind-config">tailwind.config={theme:{extend:{colors:{"primary":"#3525cd","primary-container":"#4f46e5","on-primary":"#ffffff","on-primary-container":"#dad7ff","primary-fixed":"#e2dfff","primary-fixed-dim":"#c3c0ff","secondary":"#545f73","error":"#ba1a1a","error-container":"#ffdad6","on-error-container":"#93000a","background":"#fcf8ff","on-background":"#1b1b24","surface-container-lowest":"#ffffff","surface-container-low":"#f5f2ff","surface-container":"#f0ecf9","on-surface":"#1b1b24","on-surface-variant":"#464555","outline-variant":"#c7c4d8"},fontFamily:{"body-md":["Inter"],"h1":["Inter"],"h2":["Inter"],"label-sm":["Inter"]},fontSize:{"body-md":["16px",{"lineHeight":"1.5"}],"h1":["40px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"700"}],"h2":["30px",{"lineHeight":"1.3","letterSpacing":"-0.01em","fontWeight":"600"}],"label-sm":["14px",{"lineHeight":"1.4","fontWeight":"500"}]}}}}</script>
</head>
<body class="bg-background font-body-md min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
    <div class="text-center mb-10">
        <div class="w-14 h-14 rounded-2xl bg-primary-container flex items-center justify-center font-bold text-2xl text-on-primary mx-auto mb-4">C</div>
        <h1 class="text-h2 font-h2 text-on-surface">CoachAI</h1>
        <p class="text-on-surface-variant mt-1">AI Mülakat Koçu</p>
    </div>
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant shadow-[0_4px_24px_rgba(0,0,0,0.06)] p-8">
        <div class="flex border-b border-outline-variant mb-6">
            <button id="tab-login" class="flex-1 pb-3 text-sm font-semibold text-primary border-b-2 border-primary">Giriş Yap</button>
            <button id="tab-register" class="flex-1 pb-3 text-sm font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors">Kayıt Ol</button>
        </div>
        <div id="auth-error" class="hidden mb-4 p-3 bg-error-container text-on-error-container text-sm rounded-lg border border-error/20"></div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-label-sm font-label-sm text-on-surface mb-1.5">E-posta</label>
                <input id="email" type="email" required placeholder="ornek@email.com" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            <div>
                <label class="block text-label-sm font-label-sm text-on-surface mb-1.5">Şifre</label>
                <input id="password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-lg font-semibold text-sm hover:opacity-90 transition-opacity mt-2">Giriş Yap</button>
        </form>
        <form id="register-form" class="space-y-4 hidden">
            <div>
                <label class="block text-label-sm font-label-sm text-on-surface mb-1.5">E-posta</label>
                <input id="reg-email" type="email" required placeholder="ornek@email.com" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            <div>
                <label class="block text-label-sm font-label-sm text-on-surface mb-1.5">Şifre (min 6 karakter)</label>
                <input id="reg-password" type="password" required minlength="6" placeholder="••••••••" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-lg font-semibold text-sm hover:opacity-90 transition-opacity mt-2">Hesap Oluştur</button>
        </form>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
