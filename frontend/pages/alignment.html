<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachAI - Hizalama Skoru</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/alignment.css">
</head>
<body>
    <main class="alignment-page">
        <h1>Hizalama skoru</h1>
        <p id="auth-hint" style="color: #a1a1aa; margin-bottom: 1rem;">Oturum kontrol ediliyor…</p>
        <div id="align-panel" style="display: none;">
            <label for="sel-cv">CV kaydı</label>
            <select id="sel-cv"></select>
            <label for="sel-profile">Şirket profili</label>
            <select id="sel-profile"></select>
            <button type="button" id="btn-score">Skoru hesapla</button>
        </div>
        <div id="align-error"></div>
        <div id="align-result">
            <div class="score-row">
                <div class="score-gauge-wrap" id="gauge" style="--score: 0;">
                    <span class="score-gauge-value" id="score-value">0%</span>
                </div>
                <div>
                    <p id="company-line" style="color: #a1a1aa; margin-bottom: 0.5rem;"></p>
                    <span class="risk-badge" id="risk-badge">—</span>
                </div>
            </div>
            <div class="components">
                <div class="component-card"><span>S (yetenek)</span><strong id="val-s">—</strong></div>
                <div class="component-card"><span>E (deneyim)</span><strong id="val-e">—</strong></div>
                <div class="component-card"><span>D (eğitim)</span><strong id="val-d">—</strong></div>
            </div>
            <div class="advice-box" id="advice-text"></div>
            <div class="tables">
                <h3>Eşleşen yetenekler</h3>
                <ul id="list-matched"></ul>
                <h3>Eksik / zayıf gereksinimler</h3>
                <ul id="list-missing" class="missing"></ul>
            </div>
        </div>
        <p style="margin-top: 1.5rem;"><a href="index.html">Ana sayfa</a></p>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/alignment.js"></script>
</body>
</html>
