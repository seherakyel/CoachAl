<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachAI - Ayarlar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#3525cd","primary-container":"#4f46e5","on-primary":"#ffffff","on-primary-container":"#dad7ff","primary-fixed":"#e2dfff","primary-fixed-dim":"#c3c0ff","secondary":"#545f73","on-secondary":"#ffffff","secondary-container":"#d5e0f8","on-secondary-container":"#586377","error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6","on-error-container":"#93000a","background":"#fcf8ff","on-background":"#1b1b24","surface":"#fcf8ff","surface-container-lowest":"#ffffff","surface-container-low":"#f5f2ff","surface-container":"#f0ecf9","surface-container-high":"#eae6f4","surface-container-highest":"#e4e1ee","on-surface":"#1b1b24","on-surface-variant":"#464555","surface-variant":"#e4e1ee","outline":"#777587","outline-variant":"#c7c4d8"},borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"40px","xl":"64px","gutter":"24px","base":"8px"},fontFamily:{"body-md":["Inter"],"h1":["Inter"],"h2":["Inter"],"h3":["Inter"],"body-lg":["Inter"],"label-sm":["Inter"]},fontSize:{"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"h1":["40px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"700"}],"h2":["30px",{"lineHeight":"1.3","letterSpacing":"-0.01em","fontWeight":"600"}],"h3":["24px",{"lineHeight":"1.4","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"label-sm":["14px",{"lineHeight":"1.4","fontWeight":"500"}]}}}}</script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}</style>
</head>
<body class="bg-background text-on-background font-body-md flex h-screen overflow-hidden">
<div id="sidebar-container"></div>
<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
<div id="header-container"></div>
<main class="flex-1 overflow-y-auto p-8 lg:p-xl bg-background">
<div class="max-w-[720px] mx-auto space-y-lg">

    <div>
        <h1 class="font-h1 text-h1 text-on-surface mb-xs">Ayarlar</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant">Hesap ve uygulama tercihlerinizi yönetin.</p>
    </div>

    <div id="settings-msg" class="hidden p-4 bg-primary-fixed text-on-surface rounded-xl border border-primary-fixed-dim text-sm flex items-center gap-3">
        <span class="material-symbols-outlined text-primary">check_circle</span>
        <span id="settings-msg-text"></span>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-[0_4px_24px_rgba(0,0,0,0.04)]">
        <div class="px-6 py-4 border-b border-outline-variant bg-surface-container-low flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">person</span>
            <h3 class="font-h3 text-h3 text-on-surface">Hesap Bilgileri</h3>
        </div>
        <div class="p-6 space-y-5">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary font-bold text-2xl border-2 border-primary-fixed-dim shrink-0" id="avatar-initial">—</div>
                <div>
                    <p class="font-label-sm text-label-sm text-on-surface font-semibold" id="display-email">—</p>
                    <p class="text-sm text-on-surface-variant mt-0.5">Firebase Authentication</p>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <label class="font-label-sm text-label-sm text-on-surface">Görünen Ad</label>
                <input id="display-name" type="text" placeholder="Adınızı girin" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            <button id="btn-save-profile" class="px-6 py-2.5 bg-primary-container text-on-primary rounded-lg font-label-sm text-label-sm hover:bg-primary transition-colors flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">save</span>Değişiklikleri Kaydet
            </button>
        </div>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-[0_4px_24px_rgba(0,0,0,0.04)]">
        <div class="px-6 py-4 border-b border-outline-variant bg-surface-container-low flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">lock</span>
            <h3 class="font-h3 text-h3 text-on-surface">Şifre Değiştir</h3>
        </div>
        <div class="p-6 space-y-5">
            <div class="flex flex-col gap-2">
                <label class="font-label-sm text-label-sm text-on-surface">Yeni Şifre (min 6 karakter)</label>
                <input id="new-password" type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
            </div>
            <div id="pw-error" class="hidden p-3 bg-error-container text-on-error-container text-sm rounded-lg border border-error/20"></div>
            <button id="btn-change-pw" class="px-6 py-2.5 bg-primary-container text-on-primary rounded-lg font-label-sm text-label-sm hover:bg-primary transition-colors flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">lock_reset</span>Şifreyi Güncelle
            </button>
        </div>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-[0_4px_24px_rgba(0,0,0,0.04)]">
        <div class="px-6 py-4 border-b border-outline-variant bg-surface-container-low flex items-center gap-3">
            <span class="material-symbols-outlined text-on-surface-variant">info</span>
            <h3 class="font-h3 text-h3 text-on-surface">Uygulama Bilgisi</h3>
        </div>
        <div class="p-6 space-y-3 text-sm text-on-surface-variant">
            <div class="flex justify-between items-center py-2 border-b border-outline-variant/50">
                <span>Versiyon</span><span class="font-code-snippet text-on-surface">1.0.0</span>
            </div>
            <div class="flex justify-between items-center py-2 border-b border-outline-variant/50">
                <span>Backend</span><span class="font-code-snippet text-on-surface">FastAPI + Gemini</span>
            </div>
            <div class="flex justify-between items-center py-2">
                <span>Veritabanı</span><span class="font-code-snippet text-on-surface">Firebase Firestore</span>
            </div>
        </div>
    </div>

    <div class="bg-error-container/30 border border-error/20 rounded-xl p-6 flex items-center justify-between">
        <div>
            <h3 class="font-label-sm text-label-sm font-semibold text-on-surface mb-1">Oturumu Kapat</h3>
            <p class="text-sm text-on-surface-variant">Hesabınızdan güvenli çıkış yapın.</p>
        </div>
        <button id="btn-logout" class="px-5 py-2.5 border border-error/30 text-error rounded-lg text-sm font-semibold hover:bg-error hover:text-on-error transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">logout</span>Çıkış Yap
        </button>
    </div>

</div>
</main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>initLayout("settings");</script>
<script src="../js/settings.js"></script>
</body>
</html>
