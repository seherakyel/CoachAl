<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachAI - Klasik Sınav</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#3525cd","primary-container":"#4f46e5","on-primary":"#ffffff","on-primary-container":"#dad7ff","primary-fixed":"#e2dfff","primary-fixed-dim":"#c3c0ff","secondary":"#545f73","on-secondary":"#ffffff","secondary-container":"#d5e0f8","tertiary":"#7e3000","error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6","on-error-container":"#93000a","background":"#fcf8ff","on-background":"#1b1b24","surface":"#fcf8ff","surface-container-lowest":"#ffffff","surface-container-low":"#f5f2ff","surface-container":"#f0ecf9","surface-container-high":"#eae6f4","surface-container-highest":"#e4e1ee","on-surface":"#1b1b24","on-surface-variant":"#464555","surface-variant":"#e4e1ee","outline":"#777587","outline-variant":"#c7c4d8"},borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"xs":"4px","sm":"12px","md":"24px","lg":"40px","xl":"64px","gutter":"24px","base":"8px"},fontFamily:{"body-md":["Inter"],"h1":["Inter"],"h2":["Inter"],"h3":["Inter"],"body-lg":["Inter"],"label-sm":["Inter"],"code-snippet":["Space Grotesk"]},fontSize:{"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"h1":["40px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"700"}],"h2":["30px",{"lineHeight":"1.3","letterSpacing":"-0.01em","fontWeight":"600"}],"h3":["24px",{"lineHeight":"1.4","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"label-sm":["14px",{"lineHeight":"1.4","fontWeight":"500"}],"code-snippet":["14px",{"lineHeight":"1.5","fontWeight":"400"}]}}}}</script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}</style>
</head>
<body class="bg-background text-on-background font-body-md flex h-screen overflow-hidden">
<div id="sidebar-container"></div>
<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
<div id="header-container"></div>
<main id="app-main" class="flex-1 overflow-y-auto p-8 lg:p-xl bg-background">
<div class="max-w-[800px] mx-auto space-y-lg">

<div id="setup-panel">
    <div class="mb-8">
        <h1 class="font-h1 text-h1 text-on-surface mb-2">Klasik Sınav</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant">Mülakat için CV ve şirket profilinizi seçin.</p>
    </div>
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 space-y-6">
        <div class="flex flex-col gap-2">
            <label class="font-label-sm text-label-sm text-on-surface">CV Seç</label>
            <select id="cv-select" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                <option value="">CV yükleniyor…</option>
            </select>
        </div>
        <div class="flex flex-col gap-2">
            <label class="font-label-sm text-label-sm text-on-surface">Şirket Profili</label>
            <select id="profile-select" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                <option value="">Şirket profili yükleniyor…</option>
            </select>
        </div>
        <div id="setup-error" class="hidden p-3 bg-error-container text-on-error-container text-sm rounded-lg border border-error/20"></div>
        <button id="btn-start-exam" class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-semibold text-sm hover:bg-primary transition-colors flex items-center justify-center gap-2">
            <span class="material-symbols-outlined">play_arrow</span>Sınavı Başlat
        </button>
    </div>
</div>

<div id="loading-panel" class="hidden flex flex-col items-center justify-center py-20 gap-6">
    <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
    <p class="font-body-lg text-body-lg text-on-surface-variant">AI soruları hazırlıyor…</p>
</div>

<div id="exam-panel" class="hidden space-y-lg">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="font-h2 text-h2 text-on-surface">Klasik Sınav</h1>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1" id="exam-subtitle">—</p>
        </div>
        <span class="bg-primary-fixed text-primary font-label-sm text-label-sm px-4 py-2 rounded-full font-semibold" id="exam-badge">Başladı</span>
    </div>
    <div id="questions-container" class="space-y-6"></div>
    <div id="exam-error" class="hidden p-3 bg-error-container text-on-error-container text-sm rounded-lg border border-error/20"></div>
    <div class="flex justify-end">
        <button id="btn-submit-exam" class="px-8 py-4 bg-primary text-on-primary rounded-lg font-semibold hover:opacity-90 transition-opacity flex items-center gap-2">
            <span class="material-symbols-outlined">send</span>Sınavı Teslim Et
        </button>
    </div>
</div>

<div id="result-panel" class="hidden space-y-lg">
    <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-8 shadow-[0_4px_24px_rgba(0,0,0,0.04)]">
        <h2 class="font-h2 text-h2 text-on-surface mb-6 text-center">Sınav Tamamlandı</h2>
        <div id="results-list" class="space-y-6"></div>
    </div>
    <div class="flex justify-center gap-4">
        <a href="interviews.html" class="px-6 py-3 border border-outline-variant text-on-surface rounded-lg font-semibold text-sm hover:bg-surface-container transition-colors">Yeniden Dene</a>
        <a href="reports.html" class="px-6 py-3 bg-primary text-on-primary rounded-lg font-semibold text-sm hover:opacity-90 transition-opacity">Raporu Gör</a>
    </div>
</div>

</div>
</main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/dialogs.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router.js"></script>
<script src="../js/exam.js"></script>
<script>initLayout("interviews");</script>
</body>
</html>
