<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachAI - Klasik Sınav</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/exam.css">
</head>
<body>
    <main class="exam-page">
        <h1>Klasik sınav</h1>
        <p id="auth-hint" style="color: #a1a1aa; margin-bottom: 1rem;">Oturum kontrol ediliyor…</p>
        <div id="exam-error"></div>
        <div id="setup-panel" style="display: none;">
            <label for="sel-cv">CV kaydı</label>
            <select id="sel-cv"></select>
            <label for="sel-profile">Şirket profili</label>
            <select id="sel-profile"></select>
            <button type="button" id="btn-start">Sınavı başlat</button>
        </div>
        <div id="exam-panel" style="display: none;">
            <p id="exam-info"></p>
            <form id="exam-form"></form>
            <button type="button" id="btn-submit">Cevapları gönder</button>
        </div>
        <div id="exam-result">
            <div class="score-row">
                <div class="score-gauge-wrap" id="gauge" style="--score: 0;">
                    <span class="score-gauge-value" id="score-value">0</span>
                </div>
                <div>
                    <p id="result-meta" style="color: #a1a1aa; margin-bottom: 0.25rem;"></p>
                    <p style="color: #71717a; font-size: 0.85rem;">100 üzerinden ortalama</p>
                </div>
            </div>
            <div class="summary-box" id="summary-text"></div>
            <h2 style="font-size: 1rem; margin-bottom: 0.5rem;">Soru bazında değerlendirme</h2>
            <div id="result-list"></div>
        </div>
        <p style="margin-top: 1.5rem;"><a href="index.html">Ana sayfa</a></p>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script>window.FIREBASE_CONFIG = FIREBASE_CONFIG;</script>
    <script src="../js/auth.js"></script>
    <script src="../js/exam.js"></script>
</body>
</html>
