<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachAI - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <main class="dash-page">
        <h1>Dashboard</h1>
        <p id="auth-hint" style="color: #a1a1aa; margin-bottom: 1rem;">Oturum kontrol ediliyor…</p>
        <div id="dash-error"></div>
        <p id="dash-loading">Yükleniyor…</p>

        <div id="dash-content" style="display: none;">
            <div class="dash-stats">
                <div class="stat-card"><div class="label">CV</div><div class="value" id="stat-cv">0</div></div>
                <div class="stat-card"><div class="label">Şirket profili</div><div class="value" id="stat-company">0</div></div>
                <div class="stat-card"><div class="label">Tamamlanan mülakat</div><div class="value" id="stat-interview">0</div></div>
                <div class="stat-card"><div class="label">Ortalama hizalama</div><div class="value" id="stat-avg">—</div></div>
            </div>

            <div class="dash-section">
                <h2>Şirket bazında hazırlık skorları</h2>
                <div class="chart-wrap"><canvas id="chart-bar" height="120"></canvas></div>
            </div>

            <div class="dash-section">
                <h2>En güçlü başvuru — radar</h2>
                <div class="chart-wrap" style="max-width: 480px; margin: 0 auto;"><canvas id="chart-radar" height="240"></canvas></div>
            </div>

            <div class="dash-section">
                <h2>Tüm başvurular</h2>
                <div id="app-grid" class="app-grid"></div>
            </div>
        </div>

        <p style="margin-top: 1.5rem;"><a href="index.html">Ana sayfa</a></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script>window.FIREBASE_CONFIG = FIREBASE_CONFIG;</script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
