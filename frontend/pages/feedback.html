<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachAI - Geri Bildirim</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>
    <main class="feedback-page">
        <h1>CV Doktoru</h1>
        <p id="auth-hint" style="color: #a1a1aa; margin-bottom: 1rem;">Oturum kontrol ediliyor…</p>
        <div id="fb-error"></div>
        <div id="fb-panel" style="display: none;">
            <label for="sel-align">Hizalama sonucu</label>
            <select id="sel-align"></select>
            <label for="sel-session">Mülakat oturumu (opsiyonel)</label>
            <select id="sel-session"></select>
            <button type="button" id="btn-generate">Geri bildirim üret</button>
        </div>

        <div id="fb-result">
            <p class="fb-meta" id="fb-meta"></p>
            <div class="danger-panel">
                <h2>Neden elenebilirsin?</h2>
                <p id="why-text">—</p>
            </div>
            <div class="cards-row">
                <div class="card strengths">
                    <h3>Güçlü yönler</h3>
                    <ul id="list-strengths"></ul>
                </div>
                <div class="card weaknesses">
                    <h3>Zayıf yönler</h3>
                    <ul id="list-weaknesses"></ul>
                </div>
            </div>
            <h3 class="section-title">Aksiyon planı</h3>
            <div class="action-box" id="action-text">—</div>
            <h3 class="section-title">Önerilen kaynaklar</h3>
            <ul class="resources" id="list-resources"></ul>
            <span class="prep-time" id="prep-time" style="display:none;"></span>
        </div>

        <p style="margin-top: 1.5rem;"><a href="dashboard.html">Dashboard</a> · <a href="index.html">Ana sayfa</a></p>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script>window.FIREBASE_CONFIG = FIREBASE_CONFIG;</script>
    <script src="../js/auth.js"></script>
    <script src="../js/feedback.js"></script>
</body>
</html>
