<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachAI - CV Yükle</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/upload.css">
</head>
<body>
    <main class="upload-page">
        <h1>CV Yükle</h1>
        <p id="auth-hint" style="color: #a1a1aa; margin-bottom: 1rem;">Oturum kontrol ediliyor…</p>
        <div id="upload-error"></div>
        <div id="upload-panel" style="display: none;">
            <div class="upload-zone" id="drop-zone" tabindex="0">
                <p>PDF dosyasını sürükleyip bırak veya tıklayıp seç</p>
                <input type="file" id="file-input" accept="application/pdf,.pdf">
            </div>
            <p id="file-name"></p>
            <div class="upload-actions">
                <button type="button" id="btn-upload" disabled>Yükle ve analiz et</button>
            </div>
        </div>
        <div id="upload-result">
            <h2>Sonuç</h2>
            <p id="result-meta"></p>
            <p><strong>Yetenekler</strong></p>
            <ul id="result-skills"></ul>
            <p class="preview" id="result-preview"></p>
        </div>
        <p style="margin-top: 1.5rem;"><a href="index.html">Ana sayfa</a></p>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/upload.js"></script>
</body>
</html>
